name: 01 - Java CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test Java Application
    runs-on: [self-hosted, Linux, X64, java, maven, aws]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Maven Project Structure
        run: |
          test -f pom.xml
          test -f src/main/java/com/example/App.java
          test -f src/test/java/com/example/AppTest.java
          echo "Maven project structure verified"

      - name: Check Java and Maven
        run: |
          java -version
          mvn -version

      - name: Compile Application
        run: mvn clean compile

      - name: Run Unit Tests
        run: mvn test

      - name: Package Application
        run: mvn package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app-jar
          path: target/*.jar
          if-no-files-found: error